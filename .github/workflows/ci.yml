name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token: read the repo, nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"  # fail if uv.lock is out of date with pyproject.toml

# Third-party actions are pinned to full commit SHAs (tags can be moved; SHAs can't).
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Dev group only: ruff without the 1.4 GB runtime dependencies.
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartpbl
          POSTGRES_PASSWORD: smartpbl
          POSTGRES_DB: smartpbl
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U smartpbl -d smartpbl"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SMARTPBL_DATABASE_URL: postgresql+psycopg://smartpbl:smartpbl@localhost:5442/smartpbl
      SMARTPBL_REQUIRE_DB: "1"  # a missing database fails the run instead of skipping tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      # The LLM is mocked; tests marked `ollama` are deselected by pyproject's addopts.
      - run: uv run pytest

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Known-vulnerability scan of every locked dependency. The spaCy model wheel comes
      # from a GitHub release URL, not PyPI, so the advisory database can't cover it.
      - run: |
          uv export --format requirements-txt --no-hashes --no-emit-project \
            | grep -v '^en-core-web-lg' > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The typed client must match the committed OpenAPI schema (the API side of that
      # contract is pinned by tests/test_frontend_contract.py).
      - run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npx oxlint --deny-warnings
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only (no registry push): proves the Dockerfile and lockfile still build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: smartpbl-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
