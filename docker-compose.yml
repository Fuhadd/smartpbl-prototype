# Local infrastructure. Ollama runs on the host (Metal GPU access), not in Docker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartpbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpbl}
      POSTGRES_DB: ${POSTGRES_DB:-smartpbl}
    ports:
      # Host port 5442: 5432/5433 are commonly taken by Homebrew Postgres or other projects.
      # Bound to loopback only: never expose the database to the local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    # Road travel times (Tier 2). Opt-in: needs `scripts/prepare_osrm.sh` first.
    #   docker compose --profile osrm up -d osrm
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v26.4.0
    command: osrm-routed --algorithm mld --max-table-size 500 /data/west-midlands-latest.osrm
    ports:
      - "127.0.0.1:${OSRM_HOST_PORT:-5005}:5000"  # 5000 is macOS AirPlay Receiver
    volumes:
      - ./osrm:/data:ro

volumes:
  pgdata:
