# Local infrastructure. Ollama runs on the host (Metal GPU access), not in Docker.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartpbl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartpbl}
      POSTGRES_DB: ${POSTGRES_DB:-smartpbl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
