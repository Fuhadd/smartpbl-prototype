[project]
name = "smartpbl-prototype"
version = "0.1.0"
description = "SMARTPBL: care-notes NLP, carer matching and attrition prediction for domiciliary care (synthetic-data prototype)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "en-core-web-lg",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.14.6",
    "spacy>=3.8.18",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Phrase library: one labelled phrase per line reads better than wrapped strings.
"scripts/note_templates.py" = ["E501", "N817"]  # compact C/S/M aliases
"app/nlp/baseline.py" = ["E501"]  # regex lexicon reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q -m 'not ollama'"
markers = ["ollama: needs a running local Ollama server (opt-in: pytest -m ollama)"]
